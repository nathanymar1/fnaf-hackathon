{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Submit a Request</title>
    <link rel="stylesheet" href="{% static 'requests_app/style.css' %}" />
  </head>
  <body>
    <form method="post">
      {% csrf_token %}

      <label for="building">Building</label>
      <input id="building" name="building" required />

      <label for="room">Room Number</label>
      <input id="room" name="room" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        rows="5"
        required
      ></textarea>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
